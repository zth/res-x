name: HTML compiler prototype
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - run: npm ci
      - run: bun run compiler:build
      - run: bun run res:build
        env:
          RAYON_NUM_THREADS: 2
      - run: bun test compiler/oxc.test.mjs
      - run: bun compiler/check.mjs
      - name: Install and build demo assets
        working-directory: demo
        run: |
          npm ci
          bun run build:vite
      - run: bun compiler/check-demo.mjs
