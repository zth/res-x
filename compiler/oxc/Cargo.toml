[package]
name = "resx-oxc"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
oxc_allocator = "=0.151.0"
oxc_ast = "=0.151.0"
oxc_ast_visit = "=0.151.0"
oxc_parser = "=0.151.0"
oxc_semantic = "=0.151.0"
oxc_span = "=0.151.0"
oxc_syntax = "=0.151.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
